name: Publish documentation and replay viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOXYGEN_VERSION: 1.18.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Doxygen is pinned to the same version used locally rather than taken
      # from apt. Ubuntu ships 1.9.8, and the version skew is not cosmetic:
      # CASE_SENSE_NAMES resolves differently per platform (breaking generated
      # filenames and every link to them), the header template carries
      # version-specific placeholders that an older Doxygen emits as literal
      # text, and Mermaid support does not exist before 1.10 so every diagram
      # renders as raw source. Pinning removes that entire class of problem.
      - name: Install pinned Doxygen and Graphviz
        run: |
          sudo apt-get update && sudo apt-get install --yes graphviz
          curl -fsSL "https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
            -o /tmp/doxygen.tar.gz
          sudo tar -xzf /tmp/doxygen.tar.gz -C /opt
          sudo ln -sf "/opt/doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
          doxygen --version

      # Regenerated with the same Doxygen that consumes it, so the template's
      # placeholders always match.
      - name: Regenerate the documentation header
        run: bash docs/theme/build-header.sh

      - name: Generate API documentation
        run: doxygen Doxyfile

      # The replay viewer's snapshot data is generated here rather than
      # committed: it is a derived artifact of data/interchange/*.csv, and
      # regenerating it on every push means the published viewer always
      # matches the engine that produced it. snapshot_recorder captures book
      # state *between* events, so this never touches the matching hot path
      # (ARCH_DECISIONS.md ADR-010).
      - name: Build the snapshot recorder
        run: |
          cmake -S . -B build-viz \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SANITIZERS=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_TOOLS=ON
          cmake --build build-viz --target snapshot_recorder --parallel

      # One real session and two fitted models (Poisson/CSTT baseline,
      # Hawkes self-exciting) per symbol, three symbols -- nine snapshot
      # files. File naming (<symbol>_<kind>.jsonl) is the contract the
      # viewer's JS reads directly; adding a fourth symbol later is adding
      # three lines here and three inputs under data/interchange/, no
      # viewer change.
      - name: Record replay snapshots
        run: |
          mkdir -p docs/viz/data
          declare -A LABELS=([aapl]=AAPL [intc]=INTC [msft]=MSFT)
          for sym in aapl intc msft; do
            NAME="${LABELS[$sym]}"
            ./build-viz/snapshot_recorder \
              --input  "data/interchange/${sym}_bx_20190730_sample.csv" \
              --output "docs/viz/data/${sym}_real.jsonl" \
              --label  "Real — Nasdaq BX ${NAME} 2019-07-30" \
              --tick   100
            ./build-viz/snapshot_recorder \
              --input  "data/interchange/synthetic_poisson_${sym}.csv" \
              --output "docs/viz/data/${sym}_poisson.jsonl" \
              --label  "Synthetic — Poisson (${NAME})" \
              --tick   100
            ./build-viz/snapshot_recorder \
              --input  "data/interchange/synthetic_hawkes_${sym}.csv" \
              --output "docs/viz/data/${sym}_hawkes.jsonl" \
              --label  "Synthetic — Hawkes (${NAME})" \
              --tick   100
          done
          ls -lh docs/viz/data

      # Publish both under one site: the API docs at the root, the viewer at
      # /viz/. The viewer links back into the ADRs, so they must ship together.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r doc/html/. _site/
          mkdir -p _site/viz
          cp -r docs/viz/. _site/viz/
          echo "published:"; find _site -maxdepth 2 -name '*.html' | head

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
