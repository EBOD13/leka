<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leka — Order Book Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Source+Sans+3:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="viz.css">
</head>
<body>

<header class="masthead">
  <div class="wordmark">
    <span class="name">Leka</span>
    <span class="desc">Limit order book replay</span>
  </div>
  <div class="controls">
    <div class="segmented" role="tablist">
      <button class="seg active" data-mode="real" role="tab">Real</button>
      <button class="seg" data-mode="synth" role="tab">Synthetic</button>
      <button class="seg" data-mode="both" role="tab">Compare</button>
    </div>
    <button class="icon-btn" id="themeToggle" title="Toggle appearance" aria-label="Toggle appearance">◑</button>
  </div>
</header>

<div class="transport">
  <button id="playPause" class="play" aria-label="Play">▶</button>
  <input id="scrub" type="range" min="0" max="100" value="0" step="1" aria-label="Timeline">
  <span id="position" class="counter">—</span>
  <select id="speed" aria-label="Playback speed">
    <option value="0.5">0.5×</option>
    <option value="1">1×</option>
    <option value="2" selected>2×</option>
    <option value="4">4×</option>
    <option value="8">8×</option>
  </select>
</div>

<main id="panels"></main>

<footer class="colophon">
  Snapshots are captured <em>between</em> events by <code>snapshot_recorder</code>,
  never inside <code>MatchingEngine::processEvent()</code> — so nothing shown here
  runs on the matching hot path. Latency is measured exactly as
  <code>benchmark_interchange</code> measures it.
  <a href="../md_ARCH__DECISIONS.html">ADR-010</a>
</footer>

<template id="panelTemplate">
  <section class="book">
    <header class="book-head">
      <div class="ident">
        <h2 class="title"></h2>
        <div class="last-line">
          <span class="last">—</span>
          <span class="chg"></span>
        </div>
      </div>
      <div class="quotes">
        <div class="stat bid"><span class="figure bb">—</span><span class="caption">Bid</span></div>
        <div class="stat mid"><span class="figure sp">—</span><span class="caption">Spread</span></div>
        <div class="stat ask"><span class="figure ba">—</span><span class="caption">Ask</span></div>
      </div>
    </header>

    <section class="chart-main">
      <h3>Price <span class="price-legend"><i class="sw-bid"></i>bid <i class="sw-ask"></i>ask <i class="sw-mid"></i>mid</span></h3>
      <canvas class="price" height="230"></canvas>
    </section>

    <div class="body">
      <section class="unit">
        <h3>Book <span class="levels"></span></h3>
        <div class="ladder"></div>
      </section>

      <div class="col-side">
        <section class="unit">
          <h3>Market depth <span>cumulative</span></h3>
          <canvas class="depth" height="150"></canvas>
        </section>

        <section class="unit">
          <h3>Engine latency <span class="lat-now"></span></h3>
          <canvas class="latency" height="118"></canvas>
          <div class="legend">
            <span class="k k50">p50</span>
            <span class="k k99">p99</span>
            <span class="k k999">p99.9</span>
          </div>
        </section>
      </div>

      <div class="col-side">
        <section class="unit">
          <h3>Volume <span>cumulative</span></h3>
          <canvas class="flow" height="84"></canvas>
          <div class="flowstats"></div>
        </section>

        <section class="unit">
          <h3>Tape</h3>
          <div class="tape"></div>
        </section>
      </div>
    </div>
  </section>
</template>

<script src="viz.js"></script>
</body>
</html>
